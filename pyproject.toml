[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-audio-matter-intake"
version = "0.1.0"
description = "Turn legal intake audio into signed-document delivery and deadline follow-up actions."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.51,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
